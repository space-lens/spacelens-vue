    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Qu'est-ce que l'échelle de Bortle ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "C'est une échelle de 1 à 9 qui mesure la pollution lumineuse d'un ciel nocturne : 1 correspond à un ciel totalement noir, 9 à un centre-ville très éclairé. Plus la classe est basse, plus vous verrez d'étoiles et d'objets du ciel profond."
            }
          },
          {
            "@type": "Question",
            "name": "Quand SpaceLens sera-t-il disponible ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Le lancement est prévu en 2026. Inscrivez-vous à la liste d'attente pour être informé dès l'ouverture."
            }
          },
          {
            "@type": "Question",
            "name": "Ai-je besoin d'un télescope pour utiliser SpaceLens ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Non. SpaceLens s'adresse aussi bien à l'observation à l'œil nu et aux jumelles qu'à l'astrophotographie avec instrument."
            }
          },
          {
            "@type": "Question",
            "name": "SpaceLens fonctionne-t-il pour les clubs d'astronomie ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui, c'est l'un des cas d'usage prévus : partage de soirées, coordination du covoiturage et du matériel partagé entre membres."
            }
          }
        ]
      }
